<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIAR TATTOOS</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
}

header{
padding:40px 20px;
}

.logo{
width:220px;
border-radius:20px;
}

h1{
color:#d4af37;
font-size:42px;
margin:20px 0 10px;
}

p{
color:#ccc;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:#d4af37;
color:#000;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.gallery img{
width:100%;
border-radius:15px;
}

footer{
padding:30px;
color:#888;
border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">

<h1>RIAR TATTOOS</h1>

<p>PMU • Fine Line Art</p>

<a class="btn" href="https://instagram.com/riartattoos" target="_blank">
Book on Instagram
</a>
</header>

<section class="gallery">

<img src="tattoo1.jpg">
<img src="tattoo2.jpg">
<img src="tattoo3.jpg">
<img src="tattoo4.jpg">

</section>

<footer>

<p>Instagram: @riartattoos</p>

<p>Email: info@riartattoos.com</p>

<p>© 2026 RIAR TATTOOS. All Rights Reserved.</p>

</footer>

</body>
</html>
